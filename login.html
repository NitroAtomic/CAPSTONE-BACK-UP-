<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/chatbot.css">
  
</head>

<body>

  <header class="site-header">
    <nav class="navbar">

      <div class="nav-left">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
      </div>

      <div class="nav-right">
        <div class="search-box">
          <input type="text" placeholder="Search">
        </div>

        <a href="login.html" class="btn btn-login">Log in</a>
        <a href="premium-subscription.html" class="btn btn-premium">Go Premium</a>
      </div>

    </nav>
  </header>

  <main class="login-page">

    <section class="login-container">

      <h1>Welcome back!</h1>
      <p class="login-description">
        Log in to continue your learning journey.
      </p>

      <form class="login-form">

        <div class="login-form-field">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          >
        </div>

        <div class="login-form-field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          >
        </div>

        <a href="forgot-password.html" class="forgot-password-link">
          Forgot password?
        </a>

        <button type="submit" class="login-submit-button">
          Log in
        </button>

      </form>

      <p class="create-account-text">
        Don't have an account?
        <a href="create-account.html">Create an account</a>
      </p>

    </section>

  </main>

       <!-- =========================
         AI Chatbot
         ========================= -->

    <script src="javascript/chatbot-loader.js"></script>

</body>
</html>
