<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/payment.css">
    <link rel="stylesheet" href="css/chatbot.css">

</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="login.html" class="btn btn-login">
                    Log in
                </a>
            </div>

        </nav>
    </header>


    <main class="payment-page">

        <section class="payment-container">

            <!-- =========================
                 Premium Heading
                 ========================= -->

            <div class="payment-heading">

                <div class="premium-crown-icon">
                    <img src="/images/icons/crown-hero.png" alt="">
                </div>

                <h1>Go premium</h1>

            </div>


            <!-- =========================
                 Subscription Progress
                 ========================= -->

            <div class="subscription-progress">

                <div class="subscription-progress-step subscription-progress-complete">
                    <span class="subscription-progress-number">✓</span>
                    <span>Choose plan</span>
                </div>

                <div class="subscription-progress-line"></div>

                <div class="subscription-progress-step subscription-progress-complete">
                    <span class="subscription-progress-number">✓</span>
                    <span>Create account</span>
                </div>

                <div class="subscription-progress-line"></div>

                <div class="subscription-progress-step subscription-progress-active">
                    <span class="subscription-progress-number">3</span>
                    <span>Payment</span>
                </div>

            </div>


            <!-- =========================
                 Selected Plan Summary
                 ========================= -->

            <div class="selected-plan-summary">

                <span>
                    <img class="inline-crown-icon" src="/images/icons/crown-badge.png" alt=""> Premium plan • Monthly
                </span>

                <span>
                    <strong>Price TBD</strong>
                    <small>/month</small>
                </span>

            </div>


            <!-- =========================
                 Payment Form
                 ========================= -->

            <section class="payment-card">

                <div class="payment-card-heading">

                    <h2>Payment details</h2>

                    <p>
                        Your subscription starts once payment is confirmed
                    </p>

                </div>


                <form class="payment-form">

                    <div class="payment-form-field">

                        <label for="cardholder-name">
                            Name on card
                        </label>

                        <input
                            type="text"
                            id="cardholder-name"
                            name="cardholder-name"
                            placeholder="Juan Dela Cruz"
                        >

                    </div>


                    <div class="payment-form-field">

                        <label for="card-number">
                            Card number
                        </label>

                        <input
                            type="text"
                            id="card-number"
                            name="card-number"
                            inputmode="numeric"
                            placeholder="1234 5678 9012 3456"
                        >

                    </div>


                    <div class="payment-card-details">

                        <div class="payment-form-field">

                            <label for="card-expiry">
                                Expiry
                            </label>

                            <input
                                type="text"
                                id="card-expiry"
                                name="card-expiry"
                                inputmode="numeric"
                                placeholder="MM / YY"
                            >

                        </div>


                        <div class="payment-form-field">

                            <label for="card-security-code">
                                CVV
                            </label>

                            <input
                                type="text"
                                id="card-security-code"
                                name="card-security-code"
                                inputmode="numeric"
                                placeholder="123"
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="payment-subscribe-button"
                    >
                        Subscribe
                    </button>

                </form>

            </section>

        </section>

    </main>

    <!-- =========================
         AI Chatbot
         ========================= -->

    <script src="javascript/chatbot-loader.js"></script>

</body>

</html>
