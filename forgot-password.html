<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/forgot-password.css">
    <link rel="stylesheet" href="css/chatbot.css">

</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="login.html" class="btn btn-login">
                    Log in
                </a>

                <a href="premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="forgot-password-page">

        <section class="forgot-password-container">

            <div class="forgot-password-icon">
                <img src="/images/icons/padlock.png" alt="">
            </div>

            <h1>Forgot password</h1>

            <p class="forgot-password-description">
                Enter your email and we'll send you a link to reset it
            </p>


            <form class="forgot-password-form">

                <div class="forgot-password-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@email.com"
                    >

                </div>


                <button
                    type="submit"
                    class="forgot-password-submit-button"
                >
                    Send reset link
                </button>

            </form>

        </section>


        <a href="login.html" class="forgot-password-back-link">
            Back to log in
        </a>

    </main>

       <!-- =========================
         AI Chatbot
         ========================= -->

    <script src="javascript/chatbot-loader.js"></script>

</body>

</html>
