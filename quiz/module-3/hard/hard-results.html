<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smishing Assessment Results: Hard / Advanced Level (Questions 7–10)</title>

    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/quiz-results.css">      
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="../../../index.html" class="nav-link">Home</a>
                <a href="../../../about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="../../../login.html" class="btn btn-login">Log in</a>
                <a href="../../../premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="quiz-results-page">

        <section
            class="quiz-results-container"
            id="hard-results-container"
            data-quiz-category="hard"
            data-questions-total="4"
            data-questions-standard="2"
            data-questions-scenario-based="2"
            data-points-correct="1"
            data-points-incorrect="-1"
        >

            <div class="quiz-results-icon">
                ✓
            </div>

            <h1>Hard / Advanced Level complete!</h1>

            <div class="quiz-score">
                <span class="quiz-score-earned" id="hard-score-earned">2</span>
                <span class="quiz-score-total" id="hard-score-total">/4</span>
            </div>

            <div class="quiz-results-breakdown">
                <div class="quiz-result-row" data-question-type="standard">
                    <span>Standard questions</span>
                    <span id="hard-standard-score"><strong>1/2</strong> correct</span>
                </div>
                <div class="quiz-result-row" data-question-type="scenario-based">
                    <span>Scenario-based questions</span>
                    <span id="hard-scenario-score"><strong>1/2</strong> correct</span>
                </div>
            </div>

            <div class="quiz-results-actions">

                <a href="question-7.html" class="quiz-results-button">
                    Retake quiz
                </a>

                <a href="smishing-quiz-final-results.html" class="quiz-results-button quiz-results-primary-button">
                    See Final Results
                </a>

            </div>

        </section>

    </main>

</body>

</html>
