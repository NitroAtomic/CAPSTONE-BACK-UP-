<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smishing Assessment — Question 1</title>

    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/quiz.css">      
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="../../../index.html" class="nav-link">Home</a>
                <a href="../../../about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="../../../login.html" class="btn btn-login">Log in</a>
                <a href="../../../premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="quiz-page">
 
        <section class="quiz-container">

            <!-- =========================
                 Quiz Header
                 ========================= -->

            <div class="quiz-header">

                <div>
                    <h1>Smishing Assessment</h1>
                    <p>Easy Level</p>
                </div>

                <p class="quiz-question-counter">
                    Question 1 of 10
                </p>

            </div>


            <!-- =========================
                 Quiz Progress
                 ========================= -->

            <div class="quiz-progress-container">
                <div class="quiz-progress-bar" style="width: 10%;"></div>
            </div>

            <div
                class="quiz-question-content"
                data-question-id="1"
                data-question-category="easy"
                data-question-type="standard"
                data-answer-type="single"
                data-correct-answer="b"
                data-points-correct="1"
                data-points-incorrect="-1"
            >

                <span class="quiz-question-type">
                    Standard
                </span>

                <h2 class="quiz-question-text">
                    What is the safest action to take when receiving a suspicious text message?
                </h2>


                 <!-- =========================
                     Answer Options
                     ========================= -->

                <div class="quiz-answer-list">
                    <label class="quiz-answer-option">
                        <input type="radio" name="answer" value="a">
                        <span>Tap the link to see where it leads.</span>
                    </label>
                    <label class="quiz-answer-option">
                        <input type="radio" name="answer" value="b">
                        <span>Delete the message, report it, and do not click any links.</span>
                    </label>
                    <label class="quiz-answer-option">
                        <input type="radio" name="answer" value="c">
                        <span>Forward the message to 10 friends.</span>
                    </label>
                    <label class="quiz-answer-option">
                        <input type="radio" name="answer" value="d">
                        <span>Call the unknown number and insult the caller.</span>
                    </label>
                </div>

            </div>


            <!-- =========================
                 Quiz Navigation
                 ========================= -->
            
            <div class="quiz-navigation">

                <a href="../../../modules/smishing.html" class="quiz-navigation-button">
                    Back
                </a>

                <a href="question-2.html" class="quiz-navigation-button quiz-next-button">
                    Next
                </a>

            </div>
    
        </section>

    </main>

</body>

</html>
