<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vishing Assessment — Final Results</title>

    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/quiz-results.css">      
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="../../../index.html" class="nav-link">Home</a>
                <a href="../../../about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="../../../login.html" class="btn btn-login">Log in</a>
                <a href="../../../premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="quiz-results-page">

        <section
            class="quiz-results-container"
            id="final-results-container"
            data-quiz-module="vishing"
            data-questions-total="10"
            data-questions-standard="8"
            data-questions-scenario-based="2"
            data-points-correct="1"
            data-points-incorrect="-1"
        >

            <div class="quiz-results-icon">
                ✓
            </div>

            <h1>Vishing Assessment Complete!</h1>

            <div class="quiz-score">
                <span class="quiz-score-earned" id="final-score-earned">6</span>
                <span class="quiz-score-total" id="final-score-total">/10</span>
            </div>

            <div class="quiz-results-breakdown">
                <div class="quiz-result-row" data-quiz-level="easy">
                    <span>Easy Level</span>
                    <span id="final-easy-score"><strong>2/3</strong> correct</span>
                </div>
                <div class="quiz-result-row" data-quiz-level="medium">
                    <span>Medium Level</span>
                    <span id="final-medium-score"><strong>2/3</strong> correct</span>
                </div>
                <div class="quiz-result-row" data-quiz-level="hard">
                    <span>Hard / Advanced Level</span>
                    <span id="final-hard-score"><strong>2/4</strong> correct</span>
                </div>
            </div>

            <div class="quiz-results-actions">

                <a href="../easy/question-1.html" class="quiz-results-button">
                    Retake quiz
                </a>

                <a href="../../../modules/vishing.html" class="quiz-results-button quiz-results-primary-button">
                    Back to modules
                </a>

            </div>

        </section>

    </main>

</body>

</html>
