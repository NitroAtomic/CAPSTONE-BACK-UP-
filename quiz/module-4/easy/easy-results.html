<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vishing Assessment Results: Easy Level (Questions 1–3)</title>

    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../css/quiz-results.css">      
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="../../../index.html" class="nav-link">Home</a>
                <a href="../../../about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="../../../login.html" class="btn btn-login">Log in</a>
                <a href="../../../premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="quiz-results-page">

        <section
            class="quiz-results-container"
            id="easy-results-container"
            data-quiz-category="easy"
            data-questions-total="3"
            data-questions-standard="3"
            data-questions-scenario-based="0"
            data-points-correct="1"
            data-points-incorrect="-1"
        >

            <div class="quiz-results-icon">
                ✓
            </div>

            <h1>Easy Level complete!</h1>

            <div class="quiz-score">
                <span class="quiz-score-earned" id="easy-score-earned">2</span>
                <span class="quiz-score-total" id="easy-score-total">/3</span>
            </div>

            <div class="quiz-results-breakdown">
                <div class="quiz-result-row" data-question-type="standard">
                    <span>Standard questions</span>
                    <span id="easy-standard-score"><strong>2/3</strong> correct</span>
                </div>
            </div>

            <div class="quiz-results-actions">

                <a href="question-1.html" class="quiz-results-button">
                    Retake quiz
                </a>

                <a href="../medium/question-4.html" class="quiz-results-button quiz-results-primary-button">
                    Continue to Medium Level
                </a>

            </div>

        </section>

    </main>

</body>

</html>
