<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Your Email</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/forgot-password.css">
    <link rel="stylesheet" href="css/chatbot.css">

</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <div class="nav-left">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
            </div>

            <div class="nav-right">
                <a href="login.html" class="btn btn-login">
                    Log in
                </a>

                <a href="premium-subscription.html" class="btn btn-premium">
                    Go Premium
                </a>
            </div>

        </nav>
    </header>


    <main class="forgot-password-page">

        <section class="forgot-password-container">

            <div class="forgot-password-icon">
                <img src="/images/icons/envelope.png" alt="">
            </div>

            <h1>Check your email</h1>

            <p class="forgot-password-description">
                We've sent a password reset link to
            </p>

            <p class="forgot-password-email">
                name@email.com
            </p>


            <button
                type="button"
                class="forgot-password-submit-button"
            >
                Resend link
            </button>


            <a href="login.html" class="forgot-password-inside-link">
                Back to log in
            </a>

        </section>

    </main>

       <!-- =========================
         AI Chatbot
         ========================= -->

    <script src="javascript/chatbot-loader.js"></script>

</html>
