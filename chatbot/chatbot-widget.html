<div class="chatbot-widget">

    <section
        class="chatbot-panel"
        id="chatbot-panel"
        aria-label="AI Assistant"
    >

        <header class="chatbot-header">

            <div class="chatbot-assistant-information">

                <div class="chatbot-assistant-icon">
                    AI
                </div>

                <div class="chatbot-assistant-details">
                    <h2>AI Assistant</h2>
                    <p class="chatbot-status">Online</p>
                </div>

            </div>

            <button
                type="button"
                class="chatbot-close-button"
                aria-label="Close AI Assistant"
            >
                ×
            </button>

        </header>


        <div
            class="chatbot-conversation"
            id="chatbot-conversation"
            aria-live="polite"
        >

            <div class="chatbot-message chatbot-assistant-message">
                Hello! I'm you AI Assistant. What can I help you with regarding social engineering?
            </div>

        </div>


        <form class="chatbot-message-form">

            <label
                for="chatbot-message-input"
                class="chatbot-hidden-label"
            >
                Ask the AI Assistant something
            </label>

            <div class="chatbot-input-container">

                <input
                    type="text"
                    id="chatbot-message-input"
                    name="message"
                    placeholder="Ask the AI Assistant something..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="chatbot-send-button"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

        </form>

    </section>


    <button
        type="button"
        class="chatbot-floating-button"
        aria-label="Open AI Assistant"
    >
        <span class="chatbot-floating-button-icon">
            <img src="/images/icons/chatbot-icon.png" alt="">
        </span>
    </button>

</div>
